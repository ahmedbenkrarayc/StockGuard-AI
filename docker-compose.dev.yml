services:
  app:
    image: stockguard:latest
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: